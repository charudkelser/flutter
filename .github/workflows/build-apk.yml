name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.0'
          channel: 'stable'
      - name: Regenerate Gradle wrapper
        run: |
          cd android
          if ! command -v gradle >/dev/null 2>&1; then
            curl -sL -o /tmp/gradle.zip https://services.gradle.org/distributions/gradle-8.3-bin.zip
            unzip -q /tmp/gradle.zip -d /tmp
            export PATH=/tmp/gradle-8.3/bin:$PATH
          fi
          gradle wrapper --gradle-version 8.3
      - run: flutter pub get
      - run: flutter build apk --release
      - name: Create release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: APK build ${{ github.run_number }}
          files: build/app/outputs/flutter-apk/app-release.apk
